spring.application.name=documents
server.port=${PORT:8083}

spring.datasource.url=${DOCUMENTS_DB_URL:jdbc:postgresql://localhost:5432/packit_documents}
spring.datasource.username=${DOCUMENTS_DB_USERNAME:postgres}
spring.datasource.password=${DOCUMENTS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.rabbitmq.host=${DOCUMENTS_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${DOCUMENTS_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${DOCUMENTS_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${DOCUMENTS_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.auto-startup=${DOCUMENTS_CONSUMER_ENABLED:true}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vidDVo9o0}
app.cors.allowed-origins=${DOCUMENTS_CORS_ALLOWED_ORIGINS:http://localhost:4200}
